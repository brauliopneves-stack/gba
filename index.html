<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GBA Link">
<meta name="theme-color" content="#3b2f86">
<title>GBA Link</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app/style.css">
<script src="core/util.js"></script>
<script src="core/core.js"></script>
<script src="core/arm.js"></script>
<script src="core/thumb.js"></script>
<script src="core/mmu.js"></script>
<script src="core/io.js"></script>
<script src="core/audio.js"></script>
<script src="core/video.js"></script>
<script src="core/software.js"></script>
<script src="core/irq.js"></script>
<script src="core/keypad.js"></script>
<script src="core/sio.js"></script>
<script src="core/savedata.js"></script>
<script src="core/gpio.js"></script>
<script src="core/gba.js"></script>
<script type="module" src="app/main.js"></script>
</head>
<body>

<div id="library-view" class="view">
  <header class="topbar">
    <div class="brand" aria-label="GBA Link"><span class="logo">GBA</span><span class="logo-sub">LINK</span></div>
    <div class="topbar-actions">
      <button id="btn-link" class="pill" type="button" title="Jogar dois jogos conectados">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3" /></svg>Troca
      </button>
      <button id="btn-import" class="pill pill-primary" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>Jogo
      </button>
    </div>
  </header>

  <main class="library-scroll">
    <div id="library" class="library"></div>

    <section id="empty" class="empty" hidden>
      <div class="cart cart-empty" aria-hidden="true"><div class="cart-label"><span>?</span></div></div>
      <h1>Nenhum jogo ainda</h1>
      <p>Importe arquivos <b>.gba</b> ou <b>.zip</b> salvos no app Arquivos do iPhone.</p>
      <button id="btn-import-empty" class="pill pill-primary" type="button">Importar jogo</button>
    </section>

    <footer class="library-footer">
      <button id="btn-about" class="link" type="button">Ajuda e sobre</button>
    </footer>
  </main>
</div>

<div id="player-view" class="view console" hidden>
  <div class="screens-area">
    <div class="toolbar">
      <button id="btn-menu" class="tool" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
      </button>
      <div class="power"><span class="led"></span><span id="status-text">POWER</span></div>
      <button id="btn-ff" class="tool" type="button" aria-label="Avançar rápido">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z" /></svg>
        <span id="ff-label">1×</span>
      </button>
    </div>
    <div id="screens" class="screens"></div>
  </div>

  <div class="cluster cluster-left">
    <div class="shoulder shoulder-l" data-btn="L">L</div>
    <div class="dpad-well">
      <div class="dpad" data-dpad>
        <span class="dpad-arm dpad-v"></span><span class="dpad-arm dpad-h"></span><span class="dpad-hub"></span>
      </div>
    </div>
    <div class="small-btn" data-btn="SELECT"><span></span>SELECT</div>
  </div>

  <div class="cluster cluster-right">
    <div class="shoulder shoulder-r" data-btn="R">R</div>
    <div class="face">
      <div class="face-btn face-b" data-btn="B"><span>B</span></div>
      <div class="face-btn face-a" data-btn="A"><span>A</span></div>
    </div>
    <div class="small-btn" data-btn="START"><span></span>START</div>
  </div>
</div>

<dialog id="sheet" class="sheet">
  <form method="dialog" class="sheet-body">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <p id="sheet-text"></p>
    </div>
    <div id="sheet-content"></div>
    <div id="sheet-actions" class="sheet-actions"></div>
  </form>
</dialog>

<input id="file-rom" type="file" multiple hidden>
<input id="file-save" type="file" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

</body>
</html>
